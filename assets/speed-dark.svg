<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" width="720" height="222" role="img" aria-label="playback speed of one test song on one PC: 2.2x on day 22, 4.8x with firmware code translated to C, 7.7x with translated code chained on day 23, 18.2x on day 37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
<title>playback speed of one test song on one PC: 2.2x on day 22, 4.8x with firmware code translated to C, 7.7x with translated code chained on day 23, 18.2x on day 37</title>
<rect x="0.0" y="0.0" width="720.0" height="222.0" rx="0" fill="#0d1117"/>
<text x="16.0" y="22.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="bold">playback speed of one test song on one PC, × realtime</text>
<text x="16.0" y="60.0" font-size="12" fill="#8d96a0" text-anchor="start" font-weight="normal">day 22</text>
<text x="86.0" y="60.0" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="normal">C runtime, generic CPU emulator</text>
<rect x="396.0" y="49.0" width="30.2" height="14.0" rx="1.5" fill="#6e7681"/>
<text x="434.2" y="60.0" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="normal">2.2×</text>
<text x="16.0" y="94.0" font-size="12" fill="#8d96a0" text-anchor="start" font-weight="normal">day 22</text>
<text x="86.0" y="94.0" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="normal">+ firmware code translated to C</text>
<rect x="396.0" y="83.0" width="65.6" height="14.0" rx="1.5" fill="#6e7681"/>
<text x="469.6" y="94.0" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="normal">4.8×</text>
<text x="16.0" y="128.0" font-size="12" fill="#8d96a0" text-anchor="start" font-weight="normal">day 23</text>
<text x="86.0" y="128.0" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="normal">+ translated code chained</text>
<rect x="396.0" y="117.0" width="105.6" height="14.0" rx="1.5" fill="#6e7681"/>
<text x="509.6" y="128.0" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="normal">7.7×</text>
